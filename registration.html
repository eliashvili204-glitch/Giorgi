<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A. Nobel's Day 2026 — Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-deep:  #0E1F33;
    --navy:       #1B2A4A;
    --teal:       #17394D;
    --blue:       #1B5E94;
    --blue-light: #2E7BB5;
    --gold:       #D9BF8C;
    --gold-dark:  #B89A5E;
    --bg:         #EAF0F6;
    --surface:    #FFFFFF;
    --border:     #C9D7E4;
    --text:       #0E1F33;
    --text-soft:  #5B6E82;
    --success:    #15803D;
    --warn:       #B42318;
    --radius:     12px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Montserrat', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
    background: linear-gradient(180deg, #3b4a5c 0%, #5b7893 45%, #1B5E94 100%);
    background-attachment: fixed;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(8, 20, 38, 0.35);
    animation: cardUp .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cardUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ───── HERO ───── */
  .hero {
    position: relative;
    padding: 30px 26px 26px;
    background: linear-gradient(165deg, var(--navy-deep) 0%, var(--teal) 55%, var(--blue) 120%);
    color: #fff;
    overflow: hidden;
  }
  .hero::before {
    content: 'SYSSA';
    position: absolute;
    right: -10px; top: -6px;
    font-size: 92px; font-weight: 800;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.045);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: .75;
  }
  .hero-top {
    position: relative; z-index: 1;
    font-size: 11px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .hero-event {
    position: relative; z-index: 1;
    font-size: 21px; font-weight: 800;
    letter-spacing: -0.01em; line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero-title {
    position: relative; z-index: 1;
    font-size: 40px; font-weight: 800;
    letter-spacing: -0.025em; line-height: 0.98;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .hero-session {
    position: relative; z-index: 1;
    font-size: 12px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: rgba(255,255,255,.75);
    margin-bottom: 0;
  }

  /* ───── BODY ───── */
  .body { padding: 26px 26px 30px; }

  .body-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
  .body-desc  { font-size: 12px; color: var(--text-soft); line-height: 1.6; margin-bottom: 22px; font-weight: 500; }

  .label {
    font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .field { margin-bottom: 20px; }

  .input {
    width: 100%;
    padding: 14px 15px;
    background: #F5F8FB;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit; font-size: 15px; font-weight: 500;
    color: var(--text); outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .input::placeholder { color: #8FA0B2; }
  .input:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(27,94,148,.12);
  }
  .input:disabled { opacity: .6; cursor: not-allowed; }


  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg-btn {
    padding: 13px 0;
    background: #EEF3F8;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit; font-size: 13px; font-weight: 700;
    color: var(--navy); cursor: pointer;
    transition: all .15s;
  }
  .seg-btn.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
    box-shadow: 0 4px 12px rgba(27,42,74,.28);
  }
  .seg-btn:disabled {
    opacity: .4; cursor: not-allowed;
    background: #E4EAF0; color: var(--text-soft); box-shadow: none;
  }
  .seg-btn.active:disabled { background: var(--navy); color: #fff; opacity: .45; }

  .hint {
    margin-top: 9px; min-height: 18px;
    font-size: 11.5px; font-weight: 600; line-height: 1.5;
    color: var(--text-soft);
  }
  .hint.ok   { color: var(--success); }
  .hint.done { color: var(--blue); }

  .submit {
    width: 100%;
    padding: 15px;
    margin-top: 4px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    border: none;
    border-radius: var(--radius);
    font-family: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 18px rgba(27,94,148,.32);
    transition: opacity .15s, transform .1s;
  }
  .submit:hover    { opacity: .92; }
  .submit:active   { transform: scale(.985); }
  .submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    display: none;
    margin-top: 16px; padding: 13px 15px;
    border-radius: var(--radius);
    font-size: 12.5px; line-height: 1.6; font-weight: 600;
    animation: cardUp .3s cubic-bezier(.16,1,.3,1) both;
  }
  .msg.success { display: block; background: #F0FDF4; border: 1px solid #86EFAC; color: var(--success); }
  .msg.error   { display: block; background: #FEF2F2; border: 1px solid #FCA5A5; color: var(--warn); }
  .msg.info    { display: block; background: #EAF2FA; border: 1px solid #9FC1E0; color: var(--navy); }
  .msg.warning { display: block; background: #FFF9EB; border: 1px solid #F0D99A; color: #8A5A00; }

  @media (max-width: 480px) {
    body { padding: 0; align-items: flex-start; background: var(--surface); }
    .card { max-width: 100%; border-radius: 0; box-shadow: none; min-height: 100vh; }
    .hero { padding: 28px 20px 24px; }
    .hero-title { font-size: 36px; }
    .body { padding: 24px 20px 36px; }
    .input { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="card">

  <div class="hero">
    <div class="hero-top">SYSSA</div>
    <div class="hero-event">A. Nobel’s Day 2026</div>
    <div class="hero-title">Rare<br>Diseases</div>
    <div class="hero-session">XV Scientific Session</div>
  </div>

  <div class="body">
    <div class="body-title">Register Attendance</div>
    <div class="body-desc">Enter the email you used to register. Please check in on arrival and check out at the end of the conference.</div>

    <div class="field">
      <div class="label">Email</div>
      <input class="input" id="email-inp" type="email" inputmode="email"
             placeholder="yourname@example.com" autocomplete="email"
             autocapitalize="none" spellcheck="false">
      <div class="hint" id="hint"></div>
    </div>

    <div class="field">
      <div class="label">Action</div>
      <div class="segment" id="seg-action">
        <button type="button" class="seg-btn active" id="btn-in"  data-action="in">Check-in</button>
        <button type="button" class="seg-btn"        id="btn-out" data-action="out" disabled>Check-out</button>
      </div>
    </div>

    <button type="button" class="submit" id="submit-btn">Confirm Attendance</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════════════
var SB_URL = 'https://wxhaukichoycniioakbo.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aGF1a2ljaG95Y25paW9ha2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDkxMjMsImV4cCI6MjA5NTIyNTEyM30.TEnZNISEzaCpGsj7liO4v6ihXgvyL8PnWwkHIP525Kw';

var EVENT_DAY       = 1;       // კონფერენცია ერთდღიანია
var REQUEST_TIMEOUT = 15000;   // ms
var LOOKUP_DELAY    = 500;     // ms (ელფოსტის აკრეფის შემდეგ)

// ══════════════════════════════════════════════════════════════
//  SESSION ID
// ══════════════════════════════════════════════════════════════
var sessionId = null;
try { sessionId = localStorage.getItem('conf_device_id'); } catch (e) {}
if (!sessionId) {
  sessionId = 'p_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
  try { localStorage.setItem('conf_device_id', sessionId); } catch (e) {}
}

// ══════════════════════════════════════════════════════════════
//  STATE + ELEMENTS
// ══════════════════════════════════════════════════════════════
var isSubmitting      = false;
var rateLocked        = false;
var bothDone          = false;
var countdownInterval = null;
var lookupTimer       = null;
var lookupId          = 0;

var elBtn    = document.getElementById('submit-btn');
var elEmail  = document.getElementById('email-inp');
var elMsg    = document.getElementById('msg');
var elHint   = document.getElementById('hint');
var btnIn    = document.getElementById('btn-in');
var btnOut   = document.getElementById('btn-out');

var BTN_LABEL = 'Confirm Attendance';
var EMAIL_RE  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function formatMs(ms) {
  if (ms <= 0) return '00:00:00';
  var s = Math.floor(ms / 1000);
  return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
}

function showMsg(text, type) { elMsg.textContent = text; elMsg.className = 'msg ' + type; }
function hideMsg()           { elMsg.className = 'msg'; }

function setHint(text, cls) { elHint.textContent = text || ''; elHint.className = 'hint' + (cls ? ' ' + cls : ''); }

function updateSubmit() { elBtn.disabled = isSubmitting || rateLocked || bothDone; }

function setBusy(label) {
  isSubmitting = true;
  updateSubmit();
  elBtn.innerHTML = '<span class="spinner"></span>' + label;
}
function setIdle() {
  isSubmitting = false;
  elBtn.textContent = BTN_LABEL;
  updateSubmit();
}

function currentAction() { return btnIn.classList.contains('active') ? 'in' : 'out'; }
function actionLabel(a)  { return a === 'in' ? 'Check-in' : 'Check-out'; }

function sbFetch(path, options) {
  options = options || {};
  var headers = options.headers || {};
  headers['apikey'] = SB_KEY;
  headers['Authorization'] = 'Bearer ' + SB_KEY;
  options.headers = headers;

  var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = null;
  if (controller) {
    options.signal = controller.signal;
    timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT);
  }
  return fetch(SB_URL + path, options).then(
    function (r) { if (timer) clearTimeout(timer); return r; },
    function (e) { if (timer) clearTimeout(timer); throw e; }
  );
}

// ══════════════════════════════════════════════════════════════
//  LOCAL MEMORY (სარეზერვო, თუ attendance-ის წაკითხვა დაბლოკილია)
// ══════════════════════════════════════════════════════════════
function memKey(email) { return 'conf_state_' + email; }
function memGet(email) {
  try { return JSON.parse(localStorage.getItem(memKey(email)) || '{}'); } catch (e) { return {}; }
}
function memSet(email, action) {
  var m = memGet(email);
  m[action] = true;
  try { localStorage.setItem(memKey(email), JSON.stringify(m)); } catch (e) {}
}

// ══════════════════════════════════════════════════════════════
//  STATE LOOKUP: აქვს თუ არა ამ ელფოსტას check-in / check-out
// ══════════════════════════════════════════════════════════════
function getState(email) {
  var mem = memGet(email);
  return sbFetch('/rest/v1/attendance?email=eq.' + encodeURIComponent(email) +
                 '&day=eq.' + EVENT_DAY + '&select=action', {
    headers: { 'Accept': 'application/json' }
  })
  .then(function (r) { return r.ok ? r.json() : []; })
  .catch(function () { return []; })
  .then(function (recs) {
    var st = { in: !!mem.in, out: !!mem.out };
    (recs || []).forEach(function (x) {
      if (x.action === 'in')  st.in  = true;
      if (x.action === 'out') st.out = true;
    });
    if (st.out) st.in = true;
    return st;
  });
}

// ══════════════════════════════════════════════════════════════
//  UI STATE
//  არაფერი ჩაწერილი → მხოლოდ Check-in
//  check-in ჩაწერილი → მხოლოდ Check-out
//  ორივე ჩაწერილი    → ორივე დაბლოკილი
// ══════════════════════════════════════════════════════════════
function selectAction(a) {
  btnIn.classList.toggle('active',  a === 'in');
  btnOut.classList.toggle('active', a === 'out');
}

function applyState(st) {
  if (st.in && st.out) {
    btnIn.disabled = true; btnOut.disabled = true;
    selectAction('out');
    bothDone = true;
    setHint('✔ Check-in and check-out are both recorded. Thank you!', 'done');
  } else if (st.in) {
    btnIn.disabled = true; btnOut.disabled = false;
    selectAction('out');
    bothDone = false;
    setHint('✔ Check-in recorded. Please return here to check out at the end of the conference.', 'ok');
  } else {
    btnIn.disabled = false; btnOut.disabled = true;
    selectAction('in');
    bothDone = false;
    setHint('Check-in on arrival. Check-out at the end of the conference.', '');
  }
  updateSubmit();
}

function resetState() { applyState({ in: false, out: false }); }

// ══════════════════════════════════════════════════════════════
//  EMAIL INPUT → სტატუსის ავტომატური შემოწმება
// ══════════════════════════════════════════════════════════════
elEmail.addEventListener('input', function () {
  clearTimeout(lookupTimer);
  lookupId++;

  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  rateLocked = false;
  hideMsg();
  resetState();

  var email = elEmail.value.trim().toLowerCase();
  if (!EMAIL_RE.test(email)) return;

  var myId = lookupId;
  lookupTimer = setTimeout(function () {
    setHint('Checking status…', '');
    getState(email).then(function (st) {
      if (myId !== lookupId) return;
      applyState(st);
    });
  }, LOOKUP_DELAY);
});

elEmail.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitForm();
});

// ══════════════════════════════════════════════════════════════
//  RATE LIMIT UI
// ══════════════════════════════════════════════════════════════
function showRateLimit(remainingMs) {
  if (countdownInterval) clearInterval(countdownInterval);
  isSubmitting = false;
  rateLocked = true;
  elBtn.textContent = BTN_LABEL;
  updateSubmit();

  var deadline = Date.now() + remainingMs;
  showMsg('⏳ ' + formatMs(remainingMs) + ' — please wait before registering again.', 'warning');

  countdownInterval = setInterval(function () {
    var left = deadline - Date.now();
    if (left <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      rateLocked = false;
      updateSubmit();
      showMsg('You may register again.', 'info');
      return;
    }
    showMsg('⏳ ' + formatMs(left) + ' — please wait before registering again.', 'warning');
  }, 1000);
}

// ══════════════════════════════════════════════════════════════
//  SUBMIT
// ══════════════════════════════════════════════════════════════
function submitForm() {
  if (isSubmitting || elBtn.disabled) return;

  var email = elEmail.value.trim().toLowerCase();
  if (!email || !EMAIL_RE.test(email)) {
    showMsg('Please enter a valid email address.', 'error');
    return;
  }

  var action = currentAction();
  setBusy('Checking…');
  showMsg('Verifying registration…', 'info');

  // Step 1: rate limit (fail-open თუ RPC ვერ მუშაობს)
  sbFetch('/rest/v1/rpc/check_attendance_limit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_email: email, p_session_id: sessionId })
  })
  .then(function (r) {
    if (!r.ok) throw new Error('rpc_' + r.status);
    return r.json();
  })
  .then(function (data) {
    if (data && data.limited) {
      showRateLimit(Math.round(data.remaining_ms || 0));
      return null;
    }
    return 'go';
  }, function (err) {
    console.warn('Rate limit check failed, proceeding:', err);
    return 'go';
  })
  .then(function (go) {
    if (go) doInsert(email, action);
  });
}

// ══════════════════════════════════════════════════════════════
//  PARTICIPANT CHECK + STATE CHECK + INSERT
// ══════════════════════════════════════════════════════════════
function doInsert(email, action) {
  setBusy('Processing…');
  showMsg('Submitting attendance…', 'info');

  sbFetch('/rest/v1/participants?email=eq.' + encodeURIComponent(email) + '&select=email', {
    headers: { 'Accept': 'application/json' }
  })
  .then(function (r) {
    if (!r.ok) throw new Error('participants_' + r.status);
    return r.json();
  })
  .then(function (rows) {
    if (!rows || rows.length === 0) {
      setIdle();
      showMsg('❌ Email not found. Please use your registered email.', 'error');
      return null;
    }

    return getState(email).then(function (st) {
      // წესები: ჯერ check-in, მხოლოდ შემდეგ check-out
      if (st.in && st.out) {
        setIdle(); applyState(st);
        showMsg('⚠️ Your check-in and check-out are already recorded.', 'info');
        return null;
      }
      if (action === 'out' && !st.in) {
        setIdle(); applyState(st);
        showMsg('⚠️ Please check in first. Check-out is done at the end of the conference.', 'info');
        return null;
      }
      if (action === 'in' && st.in) {
        setIdle(); applyState(st);
        showMsg('⚠️ Your check-in is already recorded. Please check out at the end of the conference.', 'info');
        return null;
      }
      return insertAttendance(email, action);
    });
  })
  .catch(function (err) {
    console.error('doInsert error:', err);
    setIdle();
    showMsg('❌ Connection failed. Please check your internet and try again.', 'error');
  });
}

function insertAttendance(email, action) {
  return sbFetch('/rest/v1/attendance', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      email:            email,
      day:              EVENT_DAY,
      action:           action,
      session_id:       sessionId,
      synced_to_sheets: false
    })
  }).then(function (res) {
    if (res.status === 201 || res.status === 409) {
      // 409 = უკვე არსებობს ეს ჩანაწერი; UI მაინც სწორ მდგომარეობაში გადადის
      memSet(email, action);
      setIdle();
      applyState(action === 'in' ? { in: true, out: false } : { in: true, out: true });
      if (res.status === 201) {
        showMsg(action === 'in'
          ? '✅ Check-in recorded successfully. Please check out at the end of the conference.'
          : '✅ Check-out recorded successfully. Thank you for attending!', 'success');
      } else {
        showMsg('⚠️ ' + actionLabel(action) + ' was already recorded for this email.', 'info');
      }
    } else {
      return res.text().then(function (body) {
        console.warn('Insert error', res.status, body);
        setIdle();
        showMsg('❌ Server error (' + res.status + '). Please try again or contact the organisers.', 'error');
      });
    }
  });
}

elBtn.addEventListener('click', submitForm);
resetState();
</script>
</body>
</html>
